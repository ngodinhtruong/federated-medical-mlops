name: Docker Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image_suffix: server
            dockerfile: server/dockerfile.flower
            context: server
          - image_suffix: inference-api
            dockerfile: server/inference_api/dockerfile.fastapi
            context: server
          - image_suffix: webapp
            dockerfile: server/webapp/Dockerfile
            context: server/webapp
          - image_suffix: monitor
            dockerfile: server/monitor/Dockerfile
            context: server/monitor
          - image_suffix: airflow
            dockerfile: server/dockerfile.airflow
            context: server
          - image_suffix: clients
            dockerfile: clients/dockerfile
            context: clients
          - image_suffix: mlflow
            dockerfile: server/dockerfile.mlflow
            context: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image_suffix }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caching to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_PATH }}
            git fetch --all
            git reset --hard origin/main
            
            # Nếu SERVER_PATH trỏ vào gốc dự án, tự động chui vào thư mục server
            if [ -d "server" ]; then cd server; fi
            
            docker compose pull
            docker compose up -d
            docker image prune -f
