global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'inference-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fast-api-server:8000']

  - job_name: 'fl-servers'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fl-server-mlp:8001', 'fl-server-cnn:8001', 'fl-server-logreg:8001']
